<svg viewBox="0 0 280 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tour Egypte logo">
  <!-- Three pyramids: Khufu (largest, center), Khafre (left-center), Menkaure (right, smallest) -->
  <!-- Horizon line -->
  <line x1="8" y1="60" x2="128" y2="60" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>

  <!-- Small left pyramid -->
  <polygon points="12,60 28,42 44,60" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.45"/>

  <!-- Large center pyramid -->
  <polygon points="38,60 68,8 98,60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Block stratification lines on center pyramid -->
  <line x1="44" y1="51" x2="92" y2="51" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="50" y1="42" x2="86" y2="42" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="56" y1="33" x2="80" y2="33" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="62" y1="24" x2="74" y2="24" stroke="currentColor" stroke-width="1" opacity="0.35"/>

  <!-- Small right pyramid -->
  <polygon points="94,60 112,38 130,60" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity="0.45"/>

  <!-- Sun disk above center pyramid -->
  <circle cx="68" cy="4" r="3.5" fill="currentColor"/>
  <!-- Sun rays -->
  <line x1="68" y1="0" x2="68" y2="-3" stroke="currentColor" stroke-width="1" opacity="0.6" transform="translate(0,3)"/>
  <line x1="72" y1="1.5" x2="75" y2="-1" stroke="currentColor" stroke-width="1" opacity="0.6" transform="translate(0,3)"/>
  <line x1="64" y1="1.5" x2="61" y2="-1" stroke="currentColor" stroke-width="1" opacity="0.6" transform="translate(0,3)"/>

  <!-- Divider dot -->
  <circle cx="148" cy="34" r="1.5" fill="currentColor" opacity="0.4"/>

  <!-- Text: Tour Egypte -->
  <text x="158" y="38" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="currentColor" letter-spacing="0.5">Tour Egypte</text>
  <!-- Tagline text below -->
  <text x="160" y="54" font-family="'Cormorant Garamond', Georgia, serif" font-size="9.5" letter-spacing="3.5" fill="currentColor" opacity="0.65">DISCOVER EGYPT</text>
</svg>
